# Django API service. Never run DB migrations from this Blueprint; inspect the
# existing Supabase schema first with `python manage.py inspect_database`.
services:
  - type: web
    name: fleetcast-django-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --no-input
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /api/v1/health/
    autoDeploy: false
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DJANGO_REQUIRE_DATABASE
        value: "True"
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: fleetcast-django-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://fleetcast-website-pjcr.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://fleetcast-website-pjcr.vercel.app
      - key: FRONTEND_URL
        value: https://fleetcast-website-pjcr.vercel.app
      - key: BACKEND_URL
        value: https://fleetcast-django-api.onrender.com
      - key: COOKIE_SECURE
        value: "True"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://fleetcast-website-pjcr.vercel.app/api/v1/auth/google/callback/
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ADS_BUCKET
        value: advertisements
      - key: SUPABASE_DOCUMENTS_BUCKET
        value: documents
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        sync: false
