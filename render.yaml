# Django API service. Campaign marketplace schema changes are additive. Demo
# campaigns are seeded idempotently and clearly marked for product walkthroughs.
services:
  - type: web
    name: fleetcast-django-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python manage.py migrate accounts 0003_userworkspace --noinput && python manage.py migrate campaigns 0003_campaignparticipation_vehicle --noinput && python manage.py seed_demo_campaigns --skip-assets && python manage.py collectstatic --no-input
    # Log path only, never the query string (Google's callback query contains
    # short-lived authorization codes and OAuth state).
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120 --access-logfile - --access-logformat '%(h)s %(l)s %(u)s %(t)s "%(m)s %(U)s %(H)s" %(s)s %(b)s'
    healthCheckPath: /api/v1/health/
    autoDeploy: false
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DJANGO_REQUIRE_DATABASE
        value: "True"
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        value: fleetcast-django-api.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://fleetcast-website-pjcr.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://fleetcast-website-pjcr.vercel.app
      - key: FRONTEND_URL
        value: https://fleetcast-website-pjcr.vercel.app
      - key: BACKEND_URL
        value: https://fleetcast-django-api.onrender.com
      - key: COOKIE_SECURE
        value: "True"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://fleetcast-website-pjcr.vercel.app/api/v1/auth/google/callback/
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ADS_BUCKET
        value: advertisements
      - key: SUPABASE_DOCUMENTS_BUCKET
        value: documents
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.smtp.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: EMAIL_USE_TLS
        value: "True"
      - key: DEFAULT_FROM_EMAIL
        sync: false
